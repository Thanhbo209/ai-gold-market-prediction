name: Data pipeline CI

on:
  push:
    branches: [main]
    paths:
      - "backend/data_pipeline/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "backend/data_pipeline/**"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/data_pipeline
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the minimum declared in pyproject.toml; 3.13 is what the Docker image ships.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/data_pipeline/pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t xauusd-data-pipeline backend/data_pipeline

      - name: Smoke test the image (import only, no network)
        run: |
          docker run --rm --entrypoint python xauusd-data-pipeline \
            -c "import gold_pipeline.ingestion, gold_pipeline.validation; print('import ok')"
