[project]
name = "ai-gold-market-prediction-backend"
version = "0.1.0"
description = "Backend for AI-powered XAUUSD market prediction"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.154.0",
    "pydantic-settings",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
    "xauusd-data-pipeline",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.workspace]
members = [
    "data_pipeline",
]

[tool.uv.sources]
xauusd-data-pipeline = { workspace = true, editable = true }
